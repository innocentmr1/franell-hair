name: Send abandoned cart reminder emails

on:
  # Schedule paused until CRON_SECRET is confirmed to match between Render
  # and GitHub Actions secrets — it was failing every run and spamming
  # failure emails. Re-enable the schedule block below once fixed.
  # schedule:
  #   - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call abandoned-cart reminders endpoint
        run: |
          curl -sf -X POST https://franell-hair.onrender.com/api/abandoned-carts/send-reminders \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
